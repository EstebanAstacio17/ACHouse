steps:
  # 1. Compilar la imagen Docker usando BuildKit para máxima velocidad de caché
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/achouse:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # 2. Enviar imagen al registro de contenedores
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/achouse:latest']

  # 3. Desplegar en Google Cloud Run (Always Free Tier: us-east1, min 0, max 2)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'achouse'
      - '--image'
      - 'gcr.io/$PROJECT_ID/achouse:latest'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/achouse:latest'
options:
  logging: CLOUD_LOGGING_ONLY
